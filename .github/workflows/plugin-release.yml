name: Antigravity Plugin Release

on:
  push:
    branches: [main]
    paths:
      - 'plugins/syncploy/**'
      - 'scripts/package-plugin.ts'
      - '.github/workflows/plugin-release.yml'
    tags:
      - 'v*'
      - 'plugin-v*'
  pull_request:
    branches: [main]
    paths:
      - 'plugins/syncploy/**'
      - 'scripts/package-plugin.ts'
      - '.github/workflows/plugin-release.yml'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish GitHub Release'
        required: true
        default: true
        type: boolean

jobs:
  bundle:
    name: Validate, Package, and Release Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Web Docs & SDK
        run: bun run build

      - name: Run Security & Supply Chain Audit
        run: bun run audit:security

      - name: Package Plugin & Generate Checksums
        run: bun run package:plugin

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-plugin-bundle
          path: |
            dist/syncploy-plugin.zip
            dist/syncploy-plugin.zip.sha256
            dist/marketplace-entry.json
          retention-days: 14

      - name: Read Checksum & Catalog
        id: read_meta
        run: |
          SHA=$(cat dist/syncploy-plugin.zip.sha256 | awk '{print $1}')
          echo "sha256=$SHA" >> $GITHUB_OUTPUT

      - name: Add Job Summary
        run: |
          echo "## ⚡ Syncploy Antigravity Plugin Bundle" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**SHA-256:** \`${{ steps.read_meta.outputs.sha256 }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Marketplace Catalog Entry (\`marketplace-entry.json\`)" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
          cat dist/marketplace-entry.json >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/syncploy-plugin.zip
            dist/syncploy-plugin.zip.sha256
            dist/marketplace-entry.json
          body: |
            ## ⚡ Syncploy Plugin for Google Antigravity & AI Agents

            ### 📦 Release Assets
            - **Plugin Archive**: `syncploy-plugin.zip`
            - **Integrity SHA-256**: `${{ steps.read_meta.outputs.sha256 }}`
            
            ### 🛒 Marketplace Submission Entry
            ```json
            $(cat dist/marketplace-entry.json)
            ```
          generate_release_notes: true
